# /etc/nginx/sites-available/phi-blueprint
# Replace blueprint.example.com with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/phi-blueprint /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blueprint.example.com
server {
    listen 80;
    server_name blueprint.example.com;

    client_max_body_size 30m;  # document uploads up to 25 MB; BPMN versions as JSON

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
